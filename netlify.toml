[build]
  command = "npm install && node ./node_modules/vite/bin/vite.js build"
  publish = "dist"

[functions]
  directory = "netlify/functions"
  included_files = ["documentos/**"]

# 1. Rutas dinámicas hacia el servidor Express (Netlify Functions)
[[redirects]]
  from = "/eAConsultaWeb/jcaptcha"
  to = "/.netlify/functions/api"
  status = 200
  force = true

[[redirects]]
  from = "/eAConsultaWeb/consulta/procesarCaptcha.do"
  to = "/.netlify/functions/api"
  status = 200
  force = true

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api"
  status = 200
  force = true

[[redirects]]
  from = "/verificardocumentos/visor"
  to = "/.netlify/functions/api"
  status = 200
  force = true

[[redirects]]
  from = "/verificardocumentos/descargar"
  to = "/.netlify/functions/api"
  status = 200
  force = true

# 2. Imágenes y CSS estáticos
[[redirects]]
  from = "/eAConsultaWeb/resources/images/*"
  to = "/images/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/eAConsultaWeb/resources/css/*"
  to = "/css/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/eAConsultaWeb/images/*"
  to = "/images/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/eAConsultaWeb/css/*"
  to = "/css/:splat"
  status = 200
  force = true

# 3. Rutas del Frontend (SPA)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200