[build]
  command = "npm run build"
  publish = "dist"

# 1. Captcha
[[redirects]]
  from = "/eAConsultaWeb/jcaptcha"
  to = "/images/cap_sample.jpg"
  status = 200
  force = true

# 2. Imágenes y CSS que incluyen "/resources/" en la ruta
[[redirects]]
  from = "/eAConsultaWeb/resources/images/*"
  to = "/images/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/eAConsultaWeb/resources/css/*"
  to = "/css/:splat"
  status = 200
  force = true

# 3. Imágenes y CSS sin "/resources/"
[[redirects]]
  from = "/eAConsultaWeb/images/*"
  to = "/images/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/eAConsultaWeb/css/*"
  to = "/css/:splat"
  status = 200
  force = true

# 4. Por si alguna ruta pide "/resources/images/*" directamente sin /eAConsultaWeb
[[redirects]]
  from = "/resources/images/*"
  to = "/images/:splat"
  status = 200
  force = true

# 5. Regla general para la aplicación
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200